<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 28" width="140" height="28">
  <!-- PCB trace icon -->
  <g transform="translate(2,2)">
    <!-- Board outline -->
    <rect x="0" y="0" width="24" height="24" rx="3" fill="#0f3460" stroke="#2ecc71" stroke-width="1.5"/>
    <!-- Traces -->
    <line x1="4" y1="8" x2="12" y2="8" stroke="#2ecc71" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="12" y1="8" x2="16" y2="12" stroke="#2ecc71" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="4" y1="16" x2="10" y2="16" stroke="#3498db" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="10" y1="16" x2="14" y2="12" stroke="#3498db" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Pads -->
    <circle cx="4" cy="8" r="2" fill="#f39c12"/>
    <circle cx="4" cy="16" r="2" fill="#f39c12"/>
    <circle cx="16" cy="12" r="2.5" fill="#e74c3c"/>
    <!-- Via -->
    <circle cx="20" cy="6" r="1.5" fill="none" stroke="#2ecc71" stroke-width="1"/>
    <circle cx="20" cy="18" r="1.5" fill="none" stroke="#3498db" stroke-width="1"/>
  </g>
  <!-- Text -->
  <text x="32" y="19" font-family="'Segoe UI',system-ui,sans-serif" font-size="16" font-weight="700" fill="#e0e0e0" letter-spacing="0.5">mill<tspan fill="#2ecc71">pcb</tspan></text>
  <!-- .com -->
  <text x="93" y="19" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="400" fill="#7fb3d5">.com</text>
</svg>
